<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clippy · Gestión de cuenta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --brand: #D95C1E;
      --brand-dark: #c24f17;
      --brand-soft: rgba(217, 92, 30, 0.10);
      --ink: #1d1c15;
      --cream: #faf8f5;
      --muted: rgba(29, 28, 21, 0.68);
      --line: rgba(29, 28, 21, 0.10);
      --danger: #DC2626;
    }

    * { box-sizing: border-box; }
    .hidden { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 0;
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 520px at 50% -12%, rgba(217, 92, 30, 0.14), transparent 62%),
        radial-gradient(620px 420px at 105% 110%, rgba(217, 92, 30, 0.08), transparent 60%),
        var(--cream);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: calc(100% - 32px);
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow:
        0 22px 50px -22px rgba(29, 28, 21, 0.30),
        0 8px 20px -12px rgba(29, 28, 21, 0.14);
      overflow: hidden;
    }

    .card-accent {
      height: 6px;
      background: linear-gradient(90deg, var(--brand) 0%, #f2914f 52%, var(--brand) 100%);
    }

    .card-body { padding: 26px 28px 28px; }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo img { display: block; width: 100%; height: 100%; object-fit: contain; }

    .brand-name {
      display: block;
      font-size: 18px;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink);
    }
    .brand-tagline {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
    }

    .divider {
      height: 1px;
      margin: 24px 0 22px;
      background: linear-gradient(90deg, transparent, rgba(217, 92, 30, 0.35), transparent);
    }

    .eyebrow {
      display: block;
      margin-bottom: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brand);
    }

    .status-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 16px;
    }
    .status-icon svg { width: 28px; height: 28px; }
    .status-icon.brand,
    .status-icon.success { background: var(--brand-soft); color: var(--brand); }
    .status-icon.alert { background: #FEF2F2; color: var(--danger); }
    .status-icon.loading { background: var(--brand-soft); color: var(--brand); }
    .status-icon.loading svg { animation: spin 0.9s linear infinite; }

    h1 {
      margin: 0 0 10px;
      font-size: 23px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--ink);
    }
    #message {
      margin: 0;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.65;
      color: var(--muted);
    }
    .error-text { color: var(--danger) !important; }

    .action-section { margin-top: 24px; }

    .email-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      margin-bottom: 20px;
      padding: 8px 12px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      word-break: break-all;
    }
    .email-pill svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--brand);
    }

    .field { margin-bottom: 16px; }
    label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
    }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      padding: 12px 44px 12px 14px;
      border: 1px solid rgba(29, 28, 21, 0.14);
      border-radius: 12px;
      background: var(--cream);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input::placeholder { color: rgba(29, 28, 21, 0.40); }
    input:focus {
      background: #FFFFFF;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-soft);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: rgba(29, 28, 21, 0.45);
      cursor: pointer;
    }
    .toggle-password:hover { color: var(--brand); background: var(--brand-soft); }
    .toggle-password svg { width: 18px; height: 18px; }

    .form-error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 12px;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #B91C1C;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
    }

    .btn {
      position: relative;
      width: 100%;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--brand);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px -8px rgba(217, 92, 30, 0.85);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn:active { transform: translateY(1px); }
    .btn:focus-visible { outline: 3px solid rgba(217, 92, 30, 0.35); outline-offset: 2px; }
    .btn:disabled { opacity: 0.65; cursor: not-allowed; box-shadow: none; }
    .btn:disabled:hover { background: var(--brand); }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
    }
    .btn.loading .spinner { display: inline-block; }

    .hint {
      margin: 12px 0 0;
      font-size: 11.5px;
      line-height: 1.5;
      text-align: center;
      color: rgba(29, 28, 21, 0.50);
    }

    .card-footer {
      padding: 14px 28px;
      background: var(--cream);
      border-top: 1px solid var(--line);
      text-align: center;
      font-size: 11px;
      color: rgba(29, 28, 21, 0.50);
    }
    .card-footer strong { color: var(--brand); font-weight: 700; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      body { padding: 16px 0; }
      .card-body { padding: 22px 20px 24px; }
      .card-footer { padding: 14px 20px; }
      h1 { font-size: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-accent" aria-hidden="true"></div>

    <div class="card-body">
      <header class="card-header">
        <div class="logo">
          <img src="../icon.svg" alt="Clippy" width="42" height="42" />
        </div>
        <div>
          <span class="brand-name">Clippy</span>
          <span class="brand-tagline">Gestión de cuenta</span>
        </div>
      </header>

      <div class="divider" aria-hidden="true"></div>

      <section aria-live="polite">
        <span id="eyebrow" class="eyebrow">Gestión de cuenta</span>
        <div id="status-icon" class="status-icon hidden" aria-hidden="true"></div>
        <h1 id="title">Procesando solicitud...</h1>
        <p id="message">Por favor espera un momento.</p>
      </section>

      <div id="verify-section" class="action-section hidden">
        <button id="verify-btn" class="btn" type="button">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">Verificar mi correo</span>
        </button>
        <p class="hint">Este enlace es de un solo uso y caduca en poco tiempo.</p>
      </div>

      <div id="reset-section" class="action-section hidden">
        <div id="user-email" class="email-pill hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </svg>
          <span id="user-email-text"></span>
        </div>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="new-password">Nueva contraseña</label>
            <div class="input-wrap">
              <input
                id="new-password"
                type="password"
                placeholder="Mínimo 6 caracteres"
                minlength="6"
                autocomplete="new-password"
                required
              />
              <button class="toggle-password" type="button" data-target="new-password" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="field">
            <label for="confirm-password">Confirmar nueva contraseña</label>
            <div class="input-wrap">
              <input
                id="confirm-password"
                type="password"
                placeholder="Repite la contraseña"
                minlength="6"
                autocomplete="new-password"
                required
              />
              <button class="toggle-password" type="button" data-target="confirm-password" aria-label="Mostrar contraseña">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div id="form-error" class="form-error hidden" role="alert"></div>
          <button id="submit-btn" class="btn" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Guardar nueva contraseña</span>
          </button>
        </form>
      </div>
    </div>

    <footer class="card-footer">
      © <span id="year"></span> <strong>Logicat Studio</strong> · Clippy
    </footer>
  </main>

  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode");
      const oobCode = params.get("oobCode");
      const apiKey = params.get("apiKey");

      const el = {
        year: document.getElementById("year"),
        eyebrow: document.getElementById("eyebrow"),
        statusIcon: document.getElementById("status-icon"),
        title: document.getElementById("title"),
        message: document.getElementById("message"),
        verifySection: document.getElementById("verify-section"),
        verifyBtn: document.getElementById("verify-btn"),
        resetSection: document.getElementById("reset-section"),
        userEmail: document.getElementById("user-email"),
        userEmailText: document.getElementById("user-email-text"),
        resetForm: document.getElementById("reset-form"),
        formError: document.getElementById("form-error"),
        submitBtn: document.getElementById("submit-btn"),
      };

      el.year.textContent = new Date().getFullYear();

      const ICONS = {
        brand: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>`,
        success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>`,
        alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5h.01"/></svg>`,
        loading: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>`,
        eyeOff: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.5 10.5 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.2 3.2"/><path d="M6.2 6.3C3.7 8.1 2 12 2 12s3.5 7 10 7a10.7 10.7 0 0 0 4.2-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`,
      };

      function setStatus(kind, title, message) {
        el.statusIcon.className = `status-icon ${kind}`;
        el.statusIcon.innerHTML = ICONS[kind] || "";
        el.title.textContent = title;
        el.message.textContent = message;
        el.message.classList.toggle("error-text", kind === "alert");
      }

      function hideSections() {
        el.verifySection.classList.add("hidden");
        el.resetSection.classList.add("hidden");
      }

      function showFatalError(title, text) {
        hideSections();
        el.eyebrow.textContent = "Atención";
        setStatus("alert", title, text);
      }

      function setLoading(button, loading, label) {
        button.disabled = loading;
        button.classList.toggle("loading", loading);
        button.querySelector(".btn-label").textContent = label;
      }

      async function callAuth(endpoint, body) {
        const res = await fetch(
          `https://identitytoolkit.googleapis.com/v1/${endpoint}?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error?.message || "REQUEST_FAILED");
        return data;
      }

      document.querySelectorAll(".toggle-password").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.getElementById(button.dataset.target);
          const reveal = input.type === "password";
          input.type = reveal ? "text" : "password";
          if (reveal) {
            button.innerHTML = ICONS.eyeOff;
            button.setAttribute("aria-label", "Ocultar contraseña");
          } else {
            button.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
            button.setAttribute("aria-label", "Mostrar contraseña");
          }
        });
      });

      if (!oobCode || !apiKey) {
        showFatalError(
          "Enlace incompleto",
          "Faltan parámetros necesarios en el enlace. Solicita uno nuevo desde Clippy."
        );
        return;
      }

      if (mode === "verifyEmail" || !mode) {
        el.eyebrow.textContent = "Verificación de correo";
        setStatus(
          "brand",
          "Confirma tu dirección de correo",
          "Pulsa el botón de abajo para verificar tu cuenta de Clippy."
        );
        el.verifySection.classList.remove("hidden");

        el.verifyBtn.addEventListener("click", async () => {
          setLoading(el.verifyBtn, true, "Verificando...");
          setStatus(
            "loading",
            "Verificando tu correo...",
            "Estamos confirmando tu dirección. No cierres esta ventana."
          );

          try {
            await callAuth("accounts:update", { oobCode });
            hideSections();
            el.eyebrow.textContent = "Verificación completada";
            setStatus(
              "success",
              "¡Correo verificado!",
              "Tu cuenta de Clippy ya está verificada. Puedes volver a la aplicación de escritorio."
            );
          } catch (_) {
            hideSections();
            el.eyebrow.textContent = "No se pudo completar";
            setStatus(
              "alert",
              "No se pudo verificar",
              "El enlace expiró o ya fue utilizado. Solicita uno nuevo desde Clippy."
            );
          } finally {
            setLoading(el.verifyBtn, false, "Verificar mi correo");
          }
        });
        return;
      }

      if (mode === "resetPassword") {
        el.eyebrow.textContent = "Recuperación de contraseña";
        setStatus("loading", "Validando enlace...", "Comprobando tu solicitud de cambio de contraseña.");

        try {
          const verifyData = await callAuth("accounts:resetPassword", { oobCode });

          setStatus("brand", "Crea una nueva contraseña", "Ingresa y confirma tu nueva contraseña para Clippy.");
          if (verifyData.email) {
            el.userEmailText.textContent = verifyData.email;
            el.userEmail.classList.remove("hidden");
          }
          el.resetSection.classList.remove("hidden");

          el.resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            el.formError.classList.add("hidden");

            const newPassword = document.getElementById("new-password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            if (newPassword.trim().length < 6) {
              el.formError.textContent = "La contraseña debe tener al menos 6 caracteres.";
              el.formError.classList.remove("hidden");
              return;
            }
            if (newPassword !== confirmPassword) {
              el.formError.textContent = "Las contraseñas no coinciden.";
              el.formError.classList.remove("hidden");
              return;
            }

            setLoading(el.submitBtn, true, "Guardando...");

            try {
              await callAuth("accounts:resetPassword", { oobCode, newPassword });

              hideSections();
              el.eyebrow.textContent = "Contraseña actualizada";
              setStatus(
                "success",
                "¡Contraseña actualizada!",
                "Ya puedes iniciar sesión en Clippy con tu nueva contraseña."
              );
            } catch (_) {
              el.formError.textContent =
                "No se pudo actualizar la contraseña. El enlace puede haber expirado.";
              el.formError.classList.remove("hidden");
              setLoading(el.submitBtn, false, "Guardar nueva contraseña");
            }
          });
        } catch (_) {
          showFatalError(
            "Enlace inválido o expirado",
            "Solicita un nuevo correo de recuperación desde la pantalla de inicio de sesión de Clippy."
          );
        }
        return;
      }

      showFatalError(
        "Acción no soportada",
        `El modo "${mode}" no está disponible en esta página.`
      );
    })();
  </script>
</body>
</html>
